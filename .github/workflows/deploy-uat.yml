name: Deploy to UAT (PRODACC)

on:
  push:
    branches:
      - 'uat/**-UAT'

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.PROD_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.PROD_USER }}
  SNOWFLAKE_PRIVATE_KEY: ${{ secrets.PROD_PRIVATE_KEY }}

jobs:
  deploy-uat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SnowCLI
        uses: Snowflake-Labs/snowflake-cli-action@v1

      - name: Extract issue ID from branch
        id: extract
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          ISSUE_ID=$(echo "$BRANCH" | sed -E 's|uat/([0-9]+)-.*|\1|')
          echo "issue_id=$ISSUE_ID" >> "$GITHUB_OUTPUT"
          echo "clone_db=UAT_${ISSUE_ID}_BRF_CORE_DB" >> "$GITHUB_OUTPUT"

      - name: Create UAT clone
        run: |
          snow sql -q "USE ROLE PROD_BRF_ETL; USE WAREHOUSE BRF_WH; CALL ADMIN_DB.DEPLOY.DEPLOY_CLONE('${{ steps.extract.outputs.issue_id }}', 'PROD', 'BRF', 'CORE', 'UAT');" \
            --account "$SNOWFLAKE_ACCOUNT" \
            --user "$SNOWFLAKE_USER" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-path <(echo "$SNOWFLAKE_PRIVATE_KEY")

      - name: Patch manifest to target UAT clone
        run: |
          CLONE_DB="${{ steps.extract.outputs.clone_db }}"
          sed -i "s|project_name: PROD_BRF_CORE_DB.DCM.BRF_CORE_PROJECT|project_name: ${CLONE_DB}.DCM.BRF_CORE_PROJECT|" dcm/manifest.yml
          sed -i "s|db: PROD_BRF_CORE_DB|db: ${CLONE_DB}|" dcm/manifest.yml
          sed -i "s|source_stage_db: PROD_BRF_CORE_DB|source_stage_db: ${CLONE_DB}|" dcm/manifest.yml
          echo "Deploying to: ${CLONE_DB}"
          cat dcm/manifest.yml

      - name: Deploy DCM to UAT clone
        run: |
          snow dcm deploy --target PROD \
            --account "$SNOWFLAKE_ACCOUNT" \
            --user "$SNOWFLAKE_USER" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-path <(echo "$SNOWFLAKE_PRIVATE_KEY")
